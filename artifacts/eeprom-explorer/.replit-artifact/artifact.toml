kind = "web"
previewPath = "/"
title = "EEPROM Explorer"
description = "A retro floppy-disk administration console for browsing, inspecting, and managing files stored on an I²C EEPROM filesystem. Includes directory navigation, file metadata, hex inspection, and hardware status controls."
version = "1.0.0"
id = "artifacts/eeprom-explorer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19951

[services.development]
run = "pnpm --filter @workspace/eeprom-explorer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eeprom-explorer", "run", "build" ]
serve = "static"
publicDir = "artifacts/eeprom-explorer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19951"
BASE_PATH = "/"
