name: Deploy SaveKey-Manager to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - artifacts/eeprom-explorer/**
      - lib/api-client-react/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .github/workflows/deploy-pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned to the v10 line: pnpm-workspace.yaml's onlyBuiltDependencies
          # (and other build-approval settings) were replaced by `allowBuilds`
          # in pnpm v11, so "latest" silently drops that config and blocks
          # every dependency's install/build script.
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SaveKey-Manager
        env:
          PORT: '5000'
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @workspace/eeprom-explorer run build

      - name: Add SPA fallback for GitHub Pages routing
        run: cp dist/public/index.html dist/public/404.html
        working-directory: artifacts/eeprom-explorer

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/eeprom-explorer/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
